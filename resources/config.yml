  admin-forcelogin-admin-success: 'ꑫ &aᴘʟᴀʏᴇʀ &f{player} &aʜᴀꜱ ʙᴇᴇɴ ᴀᴜᴛʜᴇɴᴛɪᴄᴀᴛᴇᴅ.'
