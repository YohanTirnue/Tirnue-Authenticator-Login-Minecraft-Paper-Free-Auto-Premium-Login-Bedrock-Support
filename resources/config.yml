  admin-import-success: 'ꑫ &aꜱᴜᴄᴄᴇꜱꜱꜰᴜʟʟʏ ɪᴍᴘᴏʀᴛᴇᴅ &f{count} &aᴀᴄᴄᴏᴜɴᴛꜱ ꜰʀᴏᴍ ᴀᴜᴛʜᴍᴇ!'
  admin-check-usage: 'ꑪ &bᴜꜱᴀɢᴇ: &f/{label} check <ᴘʟᴀʏᴇʀ>'
  admin-set-usage: 'ꑪ &bᴜꜱᴀɢᴇ: &f/{label} set <ᴘʟᴀʏᴇʀ> <ᴘʀᴇᴍɪᴜᴍ|ᴄʀᴀᴄᴋᴇᴅ|ʙᴇᴅʀᴏᴄᴋ>'
  admin-set-invalid-type: 'ꑬ &cɪɴᴠᴀʟɪᴅ ᴛʏᴘᴇ. ᴠᴀʟɪᴅ ᴛʏᴘᴇꜱ: &ePREMIUM, CRACKED, BEDROCK'
