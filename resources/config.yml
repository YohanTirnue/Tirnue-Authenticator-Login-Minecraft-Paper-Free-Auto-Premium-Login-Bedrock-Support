  premium-not-found: 'ꑬ &cɴᴏ ᴏꜰꜰɪᴄɪᴀʟ ᴍᴏᴊᴀɴɢ ᴘᴀɪᴅ ᴀᴄᴄᴏᴜɴᴛ ꜰᴏᴜɴᴅ ᴡɪᴛʜ ᴜꜱᴇʀɴᴀᴍᴇ: &f{player}&c.'
  premium-cracked-kick: 'ꑬ &cᴛʜɪꜱ ᴀᴄᴄᴏᴜɴᴛ ɪꜱ ʀᴇɢɪꜱᴛᴇʀᴇᴅ ᴀꜱ ᴏꜰꜰɪᴄɪᴀʟ ᴍᴏᴊᴀɴɢ ᴘʀᴇᴍɪᴜᴍ. ᴄʀᴀᴄᴋᴇᴅ ʟᴏɢɪɴꜱ ᴀʀᴇ ɴᴏᴛ ᴘᴇʀᴍɪᴛᴛᴇᴅ.'
