  admin-set-not-registered: 'ꑬ &cᴘʟᴀʏᴇʀ &f{player} &cɪꜱ ɴᴏᴛ ʀᴇɢɪꜱᴛᴇʀᴇᴅ ɪɴ ᴛʜᴇ ᴅᴀᴛᴀʙᴀꜱᴇ.'
  admin-set-success: 'ꑫ &aꜱᴇᴛ ᴀᴜᴛʜ ᴍᴏᴅᴇ ꜰᴏʀ &f{player} &aᴛᴏ &b{type}&a.'
  admin-unregister-usage: 'ꑪ &bᴜꜱᴀɢᴇ: &f/{label} unregister <ᴘʟᴀʏᴇʀ>'
  admin-unregister-success: 'ꑮ &dꜱᴜᴄᴄᴇꜱꜱꜰᴜʟʟʏ ᴜɴʀᴇɢɪꜱᴛᴇʀᴇᴅ ᴘʟᴀʏᴇʀ &f{player}&d.'
