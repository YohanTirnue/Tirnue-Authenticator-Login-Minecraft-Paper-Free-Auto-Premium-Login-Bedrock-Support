  password-too-short: 'ꑬ &cᴘᴀꜱꜱᴡᴏʀᴅ ɪꜱ ᴛᴏᴏ ꜱʜᴏʀᴛ. ᴍɪɴɪᴍᴜᴍ ʟᴇɴɢᴛʜ ɪꜱ &f{min} &cᴄʜᴀʀᴀᴄᴛᴇʀꜱ.'
  password-too-long: 'ꑬ &cᴘᴀꜱꜱᴡᴏʀᴅ ᴇxᴄᴇᴇᴅꜱ ᴍᴀxɪᴍᴜᴍ ʟᴇɴɢᴛʜ ᴏꜰ &f{max} &cᴄʜᴀʀᴀᴄᴛᴇʀꜱ.'
  passwords-dont-match: 'ꑬ &cᴘᴀꜱꜱᴡᴏʀᴅꜱ ᴅɪᴅ ɴᴏᴛ ᴍᴀᴛᴄʜ, ᴄʜᴇᴄᴋ ᴛʜᴇᴍ ᴀɢᴀɪɴ!'
