# ==============================================================================
#                             TirnueAuth Configuration
#       All-in-One Authentication Engine: Passwords, Mojang & Bedrock Auto-Login
# ==============================================================================

# Chat message prefix (supports '&' codes and hex '&#55cdfc')
# Even the [TIRNUE] tag is completely configurable here or directly inside individual raw messages!
# Set to "" for a clean slate with texture-pack glyph icons
prefix: ""

security:
  min-password-length: 4
  max-password-length: 64
  # Minutes to remember a player's IP so they don't have to re-enter password on quick reconnect
  session-timeout-minutes: 30
  # Seconds before an unauthenticated player is kicked
  login-timeout-seconds: 120
  # Maximum failed attempts before disconnect
  max-failed-attempts: 5
  # Maximum accounts registered per IP address
  max-registrations-per-ip: 4
  # Account ownership priority when conflicts occur:
  # PREMIUM: Official Mojang accounts take priority and can claim/upgrade registered cracked accounts.
  # CRACKED: First-come, first-served. Once registered as cracked, password is retained and official accounts cannot overwrite it (falls back to password login).
  priority: "PREMIUM"
  # Rapid registration surge protection & pre-join modal queue
  registration-surge:
    enabled: true
    # Maximum registrations within window before locking into queue
    threshold: 5
    # Velocity window in milliseconds (e.g. 1000ms = 1s, or 100ms)
    window-ms: 1000
    # Queue lockout duration in seconds (300s = 5 minutes)
    cooldown-seconds: 300
    # Number of registrations allowed per interval during surge
    allowed-per-interval: 5
    # Minimum reaction time for human input in ms (rejects instant bot script submissions)
    min-human-reaction-ms: 800
    # On-screen popup title and subtitle for online administrators
    popup-title: "&#ff5555⚠ &c&lʙᴏᴛᴛɪɴɢ ꜱᴜʀɢᴇ ⚠"
    popup-subtitle: "&e{count} registrations in {ms}ms &8- &bQueue Active"

mojang:
  # Enable automatic Mojang online-mode cryptographic session auto-login
  enabled: true
  auto-detect: true
  # Cache validity for Mojang profile API lookups in hours
  cache-expiry-hours: 72
  # Premium IP binding: Only auto-login premium players from their verified last-login IP
  # Unknown IPs will require the pre-join dialog password to prevent cracked impostors
  premium-ip-binding: true
  # Join surge protection: During massive connection floods, pauses outbound Mojang queries
  surge-protection:
    enabled: true
    # Connection threshold per second to trigger surge protection
    threshold: 3
  # Outbound token-bucket rate limiter for Mojang API lookups
  rate-limiter:
    enabled: true
    rate-per-second: 2.0
    burst-capacity: 5

bedrock:
  # Enable automatic Floodgate Bedrock auto-login via Xbox Live
  enabled: true
  auto-login: true
  # Kick any Java player trying to use '.' prefix to impersonate a Bedrock player
  prevent-dot-spoofing: true

limbo:
  # Apply blindness effect while player is unauthenticated
  apply-blindness: true
  # Block movement while unauthenticated
  freeze-movement: true

# Modern Paper pre-join modal dialog UI (prompts password before player enters world)
dialog:
  enabled: true
  allow-close-with-escape: false
  # When true, cancelling the pre-join dialog kicks the player; when false, lets them into in-game limbo
  login-cancel-kicks: true
  register-cancel-kicks: false
  login:
    title: "&#55cdfcʟᴏɢɪɴ"
    body: "&7ᴘʟᴇᴀꜱᴇ ᴇɴᴛᴇʀ ʏᴏᴜʀ ᴘᴀꜱꜱᴡᴏʀᴅ ᴛᴏ ᴄᴏɴᴛɪɴᴜᴇ."
    password-label: "ᴘᴀꜱꜱᴡᴏʀᴅ"
    submit-button: "&aʟᴏɢɪɴ"
    cancel-button: "&cᴄᴀɴᴄᴇʟ"
  register:
    title: "&#55cdfcʀᴇɢɪꜱᴛᴇʀ"
    body: "&7ᴄʀᴇᴀᴛᴇ ᴀɴ ᴀᴄᴄᴏᴜɴᴛ ᴛᴏ ꜱᴛᴀʀᴛ ᴘʟᴀʏɪɴɢ ᴏɴ ᴛʜɪꜱ ꜱᴇʀᴠᴇʀ."
    password-label: "ᴘᴀꜱꜱᴡᴏʀᴅ"
    confirm-label: "ᴄᴏɴꜰɪʀᴍ ᴘᴀꜱꜱᴡᴏʀᴅ"
    submit-button: "&aʀᴇɢɪꜱᴛᴇʀ"
    cancel-button: "&cᴄᴀɴᴄᴇʟ"
  queue:
    title: "&#55cdfcqᴜᴇᴜᴇ"
    body: "&eʜɪ! ʏᴏᴜ ᴀʀᴇ ɴᴇxᴛ ɪɴ ʟɪɴᴇ ꜰᴏʀ ʀᴇɢɪꜱᴛʀᴀᴛɪᴏɴ.\n\n&7• ʏᴏᴜʀ ᴘᴏꜱɪᴛɪᴏɴ: &f#{pos}\n&7• ᴇꜱᴛɪᴍᴀᴛᴇᴅ ᴡᴀɪᴛ: &b~{min} ᴍɪɴᴜᴛᴇꜱ\n\n&8(ᴘʟᴇᴀꜱᴇ ᴡᴀɪᴛ ᴀ ᴍᴏᴍᴇɴᴛ ᴡʜɪʟᴇ ᴡᴇ ᴘʀᴇᴘᴀʀᴇ ʏᴏᴜʀ ꜱᴇꜱꜱɪᴏɴ)"
    refresh-button: "&eᴄʜᴇᴄᴋ qᴜᴇᴜᴇ / ʀᴇꜰʀᴇꜱʜ"
    cancel-button: "&cᴄᴀɴᴄᴇʟ"

# Chat reminders for unauthenticated players in limbo (seconds interval)
reminder-interval-seconds: 5

messages:
