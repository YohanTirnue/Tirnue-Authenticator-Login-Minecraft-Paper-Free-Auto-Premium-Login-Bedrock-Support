  mojang-welcome: 'ꑫ &aʏᴏᴜ ᴀᴜᴛʜᴇɴᴛɪᴄᴀᴛᴇᴅ ᴛʜʀᴏᴜɢʜ ᴍᴏᴊᴀɴɢ, ʏᴏᴜ ᴀʀᴇ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀʟʟʏ ʟᴏɢɢᴇᴅ ɪɴ!'
  already-premium: 'ꑫ &aʏᴏᴜʀ ᴀᴄᴄᴏᴜɴᴛ ɪꜱ ᴀʟʀᴇᴀᴅʏ ᴠᴇʀɪꜰɪᴇᴅ ᴀꜱ ᴀɴ ᴏꜰꜰɪᴄɪᴀʟ ᴍᴏᴊᴀɴɢ ᴀᴄᴄᴏᴜɴᴛ.'
  premium-success: 'ꑫ &aᴏꜰꜰɪᴄɪᴀʟ ᴍᴏᴊᴀɴɢ ᴀᴄᴄᴏᴜɴᴛ ᴠᴇʀɪꜰɪᴇᴅ! ᴀᴜᴛᴏ-ʟᴏɢɪɴ ɪꜱ ɴᴏᴡ ᴀᴄᴛɪᴠᴇ.'
  premium-not-found: 'ꑬ &cɴᴏ ᴏꜰꜰɪᴄɪᴀʟ ᴍᴏᴊᴀɴɢ ᴘᴀɪᴅ ᴀᴄᴄᴏᴜɴᴛ ꜰᴏᴜɴᴅ ᴡɪᴛʜ ᴜꜱᴇʀɴᴀᴍᴇ: &f{player}&c.'
  switched-cracked: 'ꑭ &eʏᴏᴜʀ ᴀᴄᴄᴏᴜɴᴛ ʜᴀꜱ ʙᴇᴇɴ ꜱᴡɪᴛᴄʜᴇᴅ ᴛᴏ ᴘᴀꜱꜱᴡᴏʀᴅ ᴍᴏᴅᴇ.'

  # General permission & sender checks
  only-players: 'ꑬ &cᴛʜɪꜱ ᴄᴏᴍᴍᴀɴᴅ ᴄᴀɴ ᴏɴʟʏ ʙᴇ ᴇxᴇᴄᴜᴛᴇᴅ ʙʏ ᴘʟᴀʏᴇʀꜱ ɪɴ-ɢᴀᴍᴇ.'
  no-permission: 'ꑬ &cʏᴏᴜ ᴅᴏ ɴᴏᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪꜱꜱɪᴏɴ ᴛᴏ ᴇxᴇᴄᴜᴛᴇ ᴛʜɪꜱ ᴄᴏᴍᴍᴀɴᴅ.'

  # Admin command messages
  admin-reload-success: 'ꑫ &aᴄᴏɴꜰɪɢᴜʀᴀᴛɪᴏɴ ᴀɴᴅ ᴄᴀᴄʜᴇ ʀᴇʟᴏᴀᴅᴇᴅ ꜱᴜᴄᴄᴇꜱꜱꜰᴜʟʟʏ!'
