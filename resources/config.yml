  max-attempts-kick: 'ꑬ &cᴛᴏᴏ ᴍᴀɴʏ ꜰᴀɪʟᴇᴅ ʟᴏɢɪɴ ᴀᴛᴛᴇᴍᴘᴛꜱ.'
  dot-spoof-kick: 'ꑬ &cᴀᴄᴄᴇꜱꜱ ᴅᴇɴɪᴇᴅ: ᴏɴʟʏ ᴠᴇʀɪꜰɪᴇᴅ ʙᴇᴅʀᴏᴄᴋ ᴘʟᴀʏᴇʀꜱ ᴄᴀɴ ᴜꜱᴇ ᴛʜᴇ ''.'' ᴘʀᴇꜰɪx.'

