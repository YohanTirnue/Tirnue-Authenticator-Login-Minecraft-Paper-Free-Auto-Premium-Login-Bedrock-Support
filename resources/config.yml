  login-usage: 'ꑪ &bᴜꜱᴀɢᴇ: &f/{label} <ᴘᴀꜱꜱᴡᴏʀᴅ>'
  register-usage: 'ꑪ &bᴜꜱᴀɢᴇ: &f/{label} <ᴘᴀꜱꜱᴡᴏʀᴅ> [ᴄᴏɴꜰɪʀᴍᴘᴀꜱꜱᴡᴏʀᴅ]'
